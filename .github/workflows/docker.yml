name: Docker image

# Exactly two images:
#   push to dev  -> ghcr.io/igridz/vivosun-fetcher:dev     (testing)
#   push to main -> ghcr.io/igridz/vivosun-fetcher:latest  (production)
# Pull requests only lint and build, nothing is pushed.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: python3 -m py_compile fetch_and_configure.py
      - name: shellcheck
        run: shellcheck scripts/*.sh

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick tag
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then echo "tag=latest" >> "$GITHUB_OUTPUT"; else echo "tag=dev" >> "$GITHUB_OUTPUT"; fi

      - name: Build (and push on dev/main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/igridz/vivosun-fetcher:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
